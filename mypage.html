<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지 - 펫플스</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .profile-photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #f0f0f0;
        }

        /* 모바일 환경을 위한 미디어 쿼리 */
        @media (max-width: 768px) {
            .mypage-section h2 {
                font-size: 1.5em; /* 제목 폰트 크기 조절 */
            }
            .user-info-card p {
                font-size: 0.9em; /* 본문 폰트 크기 조절 */
            }
            .profile-links a {
                font-size: 0.9em;
            }
        }

        /* 네비게이션 토글(X) 버튼 위치 수정 */
        .nav-toggle.active .hamburger {
            background-color: transparent; /* 가운데 줄 숨기기 */
        }
        .nav-toggle.active .hamburger::before {
            transform: translateY(0) rotate(45deg);
        }
        .nav-toggle.active .hamburger::after {
            transform: translateY(0) rotate(-45deg);
        }

    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 헤더 -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <img src="images/app_icon.png" alt="펫플스 앱 아이콘">
                <h1><a href="index.html">펫플스</a></h1>
            </div>
            <nav class="nav">
                <ul id="nav-menu">
                    <li><a href="inquiry.html">1:1 문의</a></li>
                    <!-- auth.js가 동적으로 채웁니다 -->
                </ul>
            </nav>
            <button class="nav-toggle" aria-label="네비게이션 메뉴 열기">
                <span class="hamburger"></span>
            </button>
        </div>
    </header>

    <!-- 메인 콘텐츠 -->
    <main class="main-content">
        <div class="container">
            <section class="mypage-section">
                <h2>👤 마이페이지</h2>
                <div class="profile-links">
                    <a href="human_profile.html">내 프로필 관리</a>
                    <a href="pet_profile.html">반려동물 프로필 관리</a>
                </div>
                <div id="user-info" class="user-info-card">
                    <!-- auth.js가 사용자 정보를 채웁니다 -->
                    <p>정보를 불러오는 중...</p>
                </div>
                <button id="logout-btn" class="button-primary" style="margin-top: 20px; background-color: #6c757d;">로그아웃</button>
            </section>
        </div>
    </main>

    <!-- 푸터 -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Petples. All Rights Reserved.</p>
            <p>회사소개 | 이용약관 | 개인정보처리방침</p>
        </div>
    </footer>

    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('petples_user'));
            const userInfoDiv = document.getElementById('user-info');

            if (user) {
                userInfoDiv.innerHTML = `
                    <h3>👤 보호자 정보</h3>
                    <img src="images/app_icon.png" alt="보호자 사진" class="profile-photo">
                    <p><strong>아이디:</strong> <span data-field="userid"></span></p>
                    <p><strong>이름:</strong> <span data-field="human_name"></span></p>
                    <p><strong>나이:</strong> <span data-field="human_age"></span></p>
                    <p><strong>성별:</strong> <span data-field="human_gender"></span></p>
                    <p><strong>사는 동네:</strong> <span data-field="neighborhood"></span></p>
                    <hr>
                    <h3>🐾 반려동물 정보</h3>
                    <img src="images/corgi.png" alt="반려동물 사진" class="profile-photo">
                    <p><strong>동물 종류:</strong> <span data-field="pet_type"></span></p>
                    <p><strong>품종:</strong> <span data-field="pet_breed"></span></p>
                    <p><strong>성별:</strong> <span data-field="pet_gender"></span></p>
                    <p><strong>나이:</strong> <span data-field="pet_age"></span></p>
                    <p><strong>몸무게:</strong> <span data-field="pet_weight"></span></p>
                    <p><strong>등록번호:</strong> <span data-field="pet_reg_number"></span></p>
                `;
                // 가입/프로필 입력값을 HTML이 아닌 일반 텍스트로 표시합니다.
                userInfoDiv.querySelectorAll('[data-field]').forEach(field => {
                    const key = field.dataset.field;
                    const value = user[key];
                    field.textContent = value
                        ? (key === 'pet_weight' ? `${value}kg` : value)
                        : '정보 없음';
                });
            } else {
                userInfoDiv.innerHTML = '<p>로그인 정보가 없습니다. <a href="signup.html">회원가입</a>을 먼저 진행해주세요.</p>';
            }

            // 로그아웃 버튼 이벤트 리스너
            const logoutBtn = document.getElementById('logout-btn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    if (confirm('로그아웃 하시겠습니까?')) {
                        localStorage.clear(); // 모든 로컬 스토리지 데이터 삭제
                        alert('로그아웃되었습니다.');
                        window.location.href = 'login.html'; // 로그인 페이지로 이동
                    }
                });
            }

            // 모바일 네비게이션 토글
            const navToggle = document.querySelector('.nav-toggle');
            const navContainer = document.querySelector('.nav'); // 제어 대상을 .nav로 변경

            if (navToggle && navContainer) {
                navToggle.addEventListener('click', () => {
                    navContainer.classList.toggle('active'); // .nav에 active 클래스 토글
                    navToggle.classList.toggle('active');
                });
            }
        });
    </script>

</body>
</html>
